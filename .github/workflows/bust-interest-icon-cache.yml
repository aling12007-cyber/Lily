name: Refresh interest icon cache

on:
  push:
    paths:
      - .github/workflows/bust-interest-icon-cache.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add cache-busting version to refined interest icons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          version = '20260904b'
          names = ['photography','travel','tennis','horse-riding','painting']
          for name in names:
              base = f'assets/interest-{name}.png'
              # remove any older cache-busting query first
              import re
              text = re.sub(re.escape(base) + r'\?v=[^"\']+', base, text)
              text = text.replace(base + '"', base + f'?v={version}"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bust-interest-icon-cache.yml
          git commit -m "Refresh Life Beyond Work icon cache"
          git push
