name: Refine portfolio for recruiter readability

on:
  push:
    paths:
      - .github/workflows/refine-portfolio.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinements
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/refine.py
          python /tmp/refine.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/refine-portfolio.yml
          git commit -m 'Refine portfolio for recruiters'
          git push
