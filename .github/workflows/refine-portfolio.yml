name: Refine portfolio
on:
  push:
    paths:
      - '.github/workflows/refine-portfolio.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refine portfolio
        run: python .github/scripts/refine-portfolio.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git rm .github/scripts/refine-portfolio.py .github/workflows/refine-portfolio.yml
          git commit -m "Refine portfolio content and performance"
          git push
