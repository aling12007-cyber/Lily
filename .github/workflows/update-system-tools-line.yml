name: Update system tools line
on:
  push:
    paths:
      - '.github/workflows/update-system-tools-line.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update systems wording
        run: python .github/scripts/update-system-tools-line.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/update-system-tools-line.py .github/workflows/update-system-tools-line.yml
          git commit -m "Refine systems and digital tools wording"
          git push
