name: Mobile interests two columns

on:
  push:
    paths:
      - .github/workflows/mobile-life-two-columns.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update mobile Life Beyond Work layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* Mobile Life Beyond Work — 2 columns */'
          if marker not in text:
              css = base64.b64decode('').decode('utf-8')
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-life-two-columns.yml
          git commit -m "Use two-column mobile interest layout"
          git push
