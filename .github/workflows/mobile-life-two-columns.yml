name: Mobile interests two columns

on:
  push:
    paths:
      - .github/workflows/mobile-life-two-columns.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update mobile Life Beyond Work layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* Mobile Life Beyond Work — 2 columns */'
          if marker in text:
              raise SystemExit('Mobile two-column override already exists')

          css = '''
/* Mobile Life Beyond Work — 2 columns */
@media(max-width:720px){
  #life .generated-interests{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    gap:6px!important;
  }
  #life .interest-generated{
    grid-template-columns:48px minmax(0,1fr)!important;
    min-height:72px!important;
    padding:8px!important;
    gap:6px!important;
  }
  #life .interest-generated img{
    width:42px!important;
    height:42px!important;
  }
  #life .interest-copy h4{
    font-size:12px!important;
    line-height:1.25!important;
  }
  #life .generated-volunteer{
    grid-template-columns:78px minmax(0,1fr)!important;
  }
  #life .generated-volunteer-art img{
    width:60px!important;
    height:60px!important;
  }
}
'''
          text = text.replace('</style>', css + '\n</style>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mobile-life-two-columns.yml
          git commit -m "Use two-column mobile interest layout"
          git push
