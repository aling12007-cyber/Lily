name: Restore missing interests

on:
  push:
    paths:
      - .github/workflows/restore-missing-interests.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore missing interest cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<span data-lang="en">Painting</span>'
          pos = text.find(marker)
          if pos == -1:
              raise SystemExit('Painting card not found')
          insert_at = text.rfind('<article class="interest-generated">', 0, pos)
          if insert_at == -1:
              raise SystemExit('Painting article start not found')

          cards_b64 = ''
          cards = base64.b64decode(cards_b64).decode('utf-8')

          missing = [x for x in ['Photography','Travel','Tennis','Horse Riding'] if f'<span data-lang="en">{x}</span>' not in text]
          if not missing:
              raise SystemExit('No missing interest cards')

          text = text[:insert_at] + cards + text[insert_at:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-missing-interests.yml
          git commit -m "Restore missing Life Beyond Work interests"
          git push
