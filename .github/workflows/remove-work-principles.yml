name: Remove work principles
on:
  push:
    paths:
      - '.github/workflows/remove-work-principles.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Remove work principles
        run: python .github/scripts/remove-work-principles.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/remove-work-principles.py .github/workflows/remove-work-principles.yml
          git commit -m "Remove work principles cards"
          git push
