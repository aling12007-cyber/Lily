name: Rebalance typography and content
on:
  push:
    paths:
      - '.github/workflows/rebalance-typography-content.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rebalance typography and content
        run: python .github/scripts/rebalance-typography-content.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/rebalance-typography-content.py .github/workflows/rebalance-typography-content.yml
          git commit -m "Rebalance typography and reduce content noise"
          git push
