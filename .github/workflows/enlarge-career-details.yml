name: Enlarge career detail text

on:
  push:
    paths:
      - '.github/workflows/enlarge-career-details.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enlarge career detail content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* V59 larger career detail typography */'
          css = (
              '\n/* V59 larger career detail typography */\n'
              '.career-detail{padding:16px 18px 18px 156px!important;}\n'
              '.career-detail .career-resp,.career-detail .career-resp li,.career-detail p,.career-detail li{font-size:15px!important;line-height:1.78!important;}\n'
              '.career-detail h4,.career-detail h5,.career-detail strong{font-size:15px!important;line-height:1.5!important;}\n'
              '.career-detail ul{margin-top:6px!important;margin-bottom:8px!important;padding-left:22px!important;}\n'
              '.career-detail li{margin:5px 0!important;}\n'
              '@media(max-width:720px){\n'
              '  .career-detail{padding:14px 14px 16px!important;}\n'
              '  .career-detail .career-resp,.career-detail .career-resp li,.career-detail p,.career-detail li{font-size:14px!important;line-height:1.72!important;}\n'
              '  .career-detail h4,.career-detail h5,.career-detail strong{font-size:14px!important;}\n'
              '}\n'
          )
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/enlarge-career-details.yml
          git commit -m 'Enlarge career detail typography'
          git push
