name: Harmonize career typography
on:
  push:
    paths:
      - '.github/workflows/harmonize-career-typography.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Harmonize career detail typography
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* V62 harmonized career detail typography */'
          css = base64.b64decode('').decode('utf-8')
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/harmonize-career-typography.yml
          git commit -m "Harmonize career detail typography"
          git push
