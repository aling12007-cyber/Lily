name: Add work philosophy
on:
  push:
    paths:
      - '.github/workflows/add-work-philosophy.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update portfolio
        run: python .github/scripts/add-work-philosophy.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/add-work-philosophy.py .github/workflows/add-work-philosophy.yml
          git commit -m "Add work philosophy section"
          git push
