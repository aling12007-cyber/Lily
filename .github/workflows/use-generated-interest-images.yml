name: Use generated interest images

on:
  push:
    paths:
      - .github/workflows/use-generated-interest-images.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild interest cards with generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '<div class="life-strip generated-interests">'
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Life interests block not found')

          pos = start + len(start_marker)
          depth = 1
          token_re = re.compile(r'<div\b[^>]*>|</div>')
          end = None
          for m in token_re.finditer(text, pos):
              if m.group(0).startswith('</div'):
                  depth -= 1
                  if depth == 0:
                      end = m.end()
                      break
              else:
                  depth += 1
          if end is None:
              raise SystemExit('Could not find end of Life interests block')

          block = '''<div class="life-strip generated-interests">
  <article class="interest-generated">
    <img src="assets/embedded-013a417ae4b1.png" alt="Kyudo illustration">
    <div class="interest-copy"><h4><span data-lang="en">Kyudo</span><span data-lang="ja">弓道</span><span data-lang="zh">弓道</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/embedded-1b9abf4de630.png" alt="Badminton illustration">
    <div class="interest-copy"><h4><span data-lang="en">Badminton</span><span data-lang="ja">バドミントン</span><span data-lang="zh">羽球</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/embedded-42f2c5c55c10.png" alt="Swimming illustration">
    <div class="interest-copy"><h4><span data-lang="en">Swimming</span><span data-lang="ja">水泳</span><span data-lang="zh">游泳</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/embedded-35ec7337baa0.png" alt="City walking illustration">
    <div class="interest-copy"><h4><span data-lang="en">City Walking</span><span data-lang="ja">散歩・街歩き</span><span data-lang="zh">散步・城市漫遊</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/interest-photography.png" alt="Photography illustration" loading="lazy">
    <div class="interest-copy"><h4><span data-lang="en">Photography</span><span data-lang="ja">写真</span><span data-lang="zh">攝影</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/interest-travel.png" alt="Travel illustration" loading="lazy">
    <div class="interest-copy"><h4><span data-lang="en">Travel</span><span data-lang="ja">旅行</span><span data-lang="zh">旅行</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/interest-tennis.png" alt="Tennis illustration" loading="lazy">
    <div class="interest-copy"><h4><span data-lang="en">Tennis</span><span data-lang="ja">テニス</span><span data-lang="zh">網球</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/interest-horse-riding.png" alt="Horse riding illustration" loading="lazy">
    <div class="interest-copy"><h4><span data-lang="en">Horse Riding</span><span data-lang="ja">乗馬</span><span data-lang="zh">騎馬</span></h4></div>
  </article>
  <article class="interest-generated">
    <img src="assets/interest-painting.png" alt="Painting illustration" loading="lazy">
    <div class="interest-copy"><h4><span data-lang="en">Painting</span><span data-lang="ja">絵画</span><span data-lang="zh">繪畫</span></h4></div>
  </article>
</div>'''

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/use-generated-interest-images.yml
          git commit -m "Use generated images for interest icons"
          git push
