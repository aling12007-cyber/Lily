name: Update portfolio details

on:
  push:
    paths:
      - .github/workflows/update-portfolio-details.yml

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio
        run: python .github/update_portfolio.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/update_portfolio.py .github/workflows/update-portfolio-details.yml
          git add index.html
          git commit -m "Refine portfolio spacing and career details"
          git push
