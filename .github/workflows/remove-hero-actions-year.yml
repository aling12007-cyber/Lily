name: Remove hero actions and year

on:
  push:
    paths:
      - .github/workflows/remove-hero-actions-year.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove hero buttons and Tokyo year
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          actions = '''      <div class="actions">
        <a class="btn primary" href="#experience"><span data-lang="en">View Career</span><span data-lang="ja">職歴を見る</span><span data-lang="zh">查看職涯</span></a>
        <a class="btn" href="https://www.linkedin.com/in/yu-ling-l-0a185a166" target="_blank" rel="noopener">LinkedIn</a>
        <a class="btn" href="assets/LIN_YULING_Resume.pdf" download><span data-lang="en">Download Resume</span><span data-lang="ja">履歴書 PDF</span><span data-lang="zh">下載履歷 PDF</span></a>
        <a class="btn" href="mailto:aling12007@icloud.com"><span data-lang="en">Email</span><span data-lang="ja">メール</span><span data-lang="zh">Email</span></a>
      </div>
'''

          year = '      <div class="year">TOKYO / 2026</div>\n'

          if actions not in text:
              raise SystemExit('hero actions block not found')
          if year not in text:
              raise SystemExit('TOKYO / 2026 block not found')

          text = text.replace(actions, '', 1)
          text = text.replace(year, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-hero-actions-year.yml
          git commit -m "Remove hero buttons and Tokyo year"
          git push
