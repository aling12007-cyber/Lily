name: Remove hero actions and year

on:
  push:
    paths:
      - .github/workflows/remove-hero-actions-year.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove hero buttons and Tokyo year
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start = text.find('<div class="actions">')
          if start == -1:
              raise SystemExit('hero actions block not found')
          end = text.find('</div>', start)
          if end == -1:
              raise SystemExit('hero actions closing tag not found')
          end += len('</div>')
          text = text[:start] + text[end:]

          year = '<div class="year">TOKYO / 2026</div>'
          if year not in text:
              raise SystemExit('TOKYO / 2026 block not found')
          text = text.replace(year, '', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-hero-actions-year.yml
          git commit -m "Remove hero buttons and Tokyo year"
          git push
