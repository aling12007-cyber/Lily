name: Final website polish

on:
  push:
    paths:
      - .github/workflows/final-website-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update content and consolidate Life Beyond Work styles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'Based in Tokyo, I want to keep deepening my accounting expertise and create value in an environment that respects professional judgment, process improvement and cross-border collaboration.': 'Based in Tokyo. Feel free to reach out regarding accounting, finance, or career opportunities.',
            '東京を拠点に会計の専門性をさらに深め、専門的な判断、業務改善、国際的な連携を大切にする環境で価値を生み出していきたいと考えています。': '現在東京を拠点としております。経理・財務およびキャリアに関するご連絡をお待ちしております。',
            '目前以東京為據點，希望持續深化會計專業，並在尊重專業判斷、重視流程改善與跨國協作的環境中創造價值。': '目前以東京為據點，歡迎就會計、財務及相關職涯機會與我聯絡。',
            '會計・審計 11+ 年': '會計・審計 11 年以上',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          # Correct the accounting standard throughout EN / JA / ZH without double-prefixing.
          text = re.sub(r'(?<!J-)GAAP', 'J-GAAP', text)

          # Refresh the five added interest assets to avoid stale browser/CDN cache.
          for slug in ['photography','travel','tennis','horse-riding','painting']:
              text = re.sub(
                  rf'assets/interest-{re.escape(slug)}\.png(?:\?v=[^"\s>]*)?',
                  f'assets/interest-{slug}.png?v=20260904c',
                  text
              )

          # Remove obsolete named override blocks from earlier iterations.
          labels = [
              'V25 larger, clearer line-art illustrations',
              'compact Life Beyond Work spacing',
              'unified line-art style for added interests',
              'refined generated interest icon images',
              'Life Beyond Work — canonical layout',
          ]
          for label in labels:
              text = re.sub(
                  r'/\* ' + re.escape(label) + r' \*/.*?(?=/\*|</style>)',
                  '', text, flags=re.S
              )

          css = '''
/* Life Beyond Work — canonical layout */
#life.section{padding-top:20px!important;padding-bottom:20px!important}
#life .rule{margin:7px 0 11px!important}
#life .generated-interests{
  display:grid!important;
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:6px!important;
}
#life .interest-generated{
  min-height:82px!important;
  display:grid!important;
  grid-template-columns:66px minmax(0,1fr)!important;
  align-items:center!important;
  gap:7px!important;
  padding:7px 10px!important;
  border:1px solid rgba(78,61,82,.10)!important;
  border-radius:14px!important;
  background:rgba(255,255,255,.76)!important;
  box-shadow:0 6px 16px rgba(78,61,82,.035)!important;
}
#life .interest-generated img{
  width:58px!important;
  height:58px!important;
  object-fit:contain!important;
  object-position:center!important;
  justify-self:center!important;
  display:block!important;
}
#life .interest-generated img[src*="interest-photography"]{transform:scale(1.16)}
#life .interest-generated img[src*="interest-travel"]{transform:scale(1.22)}
#life .interest-generated img[src*="interest-tennis"]{transform:scale(1.20)}
#life .interest-generated img[src*="interest-horse-riding"]{transform:scale(1.14)}
#life .interest-generated img[src*="interest-painting"]{transform:scale(1.16)}
#life .interest-copy h4{margin:0!important;font-size:13.5px!important;line-height:1.25!important}
#life .generated-volunteer{min-height:106px!important;margin-top:8px!important}
#life .generated-volunteer-art img{width:72px!important;height:72px!important;object-fit:contain!important}
@media(max-width:720px){
  #life .generated-interests{grid-template-columns:1fr!important;gap:6px!important}
  #life .interest-generated{
    grid-template-columns:60px minmax(0,1fr)!important;
    min-height:76px!important;
    padding:6px 9px!important;
  }
  #life .interest-generated img{width:54px!important;height:54px!important}
  #life .generated-volunteer{grid-template-columns:78px minmax(0,1fr)!important}
  #life .generated-volunteer-art img{width:60px!important;height:60px!important}
}
'''
          text = text.replace('</style>', css + '\n</style>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/final-website-polish.yml
          git commit -m "Polish contact, J-GAAP and Life Beyond Work"
          git push
