name: Apply project highlights
on:
  push:
    paths:
      - '.github/workflows/apply-project-highlights.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update portfolio
        run: python .github/scripts/update-project-highlights.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/update-project-highlights.py .github/workflows/apply-project-highlights.yml
          git commit -m "Add key career projects and update degree"
          git push
