name: Reorder mobile header controls

on:
  push:
    paths:
      - .github/workflows/reorder-mobile-header.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder mobile language and menu controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '''
/* mobile header control order */
@media(max-width:720px){
  .signature{order:1}
  .lang{order:2;margin-left:auto}
  .mobile-menu{order:3;margin-left:0}
}
'''

          if '/* mobile header control order */' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/reorder-mobile-header.yml
          git commit -m "Place language switcher left of mobile menu"
          git push
