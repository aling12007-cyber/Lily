name: Reorder mobile header controls

on:
  push:
    paths:
      - .github/workflows/reorder-mobile-header.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder mobile language and menu controls
        run: python -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(encoding='utf-8'); css='\n/* mobile header control order */\n@media(max-width:720px){\n.signature{order:1}\n.lang{order:2;margin-left:auto}\n.mobile-menu{order:3;margin-left:0}\n}\n'; t=t if '/* mobile header control order */' in t else t.replace('</style>',css+'\n</style>',1); p.write_text(t,encoding='utf-8')"
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/reorder-mobile-header.yml
          git commit -m "Place language switcher left of mobile menu"
          git push
