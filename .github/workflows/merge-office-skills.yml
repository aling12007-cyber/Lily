name: Merge Office skills
on:
  push:
    paths:
      - '.github/workflows/merge-office-skills.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Merge Office skills
        run: python .github/scripts/merge-office-skills.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/merge-office-skills.py .github/workflows/merge-office-skills.yml
          git commit -m "Merge Office skills into one line"
          git push
