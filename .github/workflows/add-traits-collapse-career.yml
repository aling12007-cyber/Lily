name: Add traits and collapse secondary career

on:
  push:
    paths:
      - '.github/workflows/add-traits-collapse-career.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update About traits and career visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          tags = base64.b64decode('').decode('utf-8')
          secondary_button = base64.b64decode('').decode('utf-8')
          star = base64.b64decode('PHN2ZyBjbGFzcz0ibWlsZXN0b25lLXN0YXIiIHZpZXdCb3g9IjAgMCAyNCAyNCIgYXJpYS1oaWRkZW49InRydWUiPjxwYXRoIGQ9Ik0xMiAyLjggMTQuOCA4LjVsNi4zLjktNC41NSA0LjQzIDEuMDcgNi4yNkwxMiAxNy4xNWwtNS42MiAyLjk0IDEuMDctNi4yNkwyLjkgOS40bDYuMy0uOUwxMiAyLjhaIi8+PC9zdmc+').decode('utf-8')
          css = base64.b64decode('').decode('utf-8')
          js = base64.b64decode('').decode('utf-8')

          if 'about-trait-tags' not in s:
              profile_start = s.find('<section class="section" id="profile">')
              story_start = s.find('<details class="about-story-details">', profile_start)
              if profile_start == -1 or story_start == -1:
                  raise SystemExit('About section insertion point not found')
              indented_tags = '      ' + tags.replace('\n', '\n      ') + '\n      '
              s = s[:story_start] + indented_tags + s[story_start:]

          jumbo = s.find('Jumbo Technology Co., Ltd.')
          if jumbo == -1:
              raise SystemExit('Jumbo Technology entry not found')
          article_start = s.rfind('<article class="career-entry">', 0, jumbo)
          important_start = s.rfind('<article class="career-entry important">', 0, jumbo)
          if article_start > important_start:
              s = s[:article_start] + '<article class="career-entry important">' + s[article_start + len('<article class="career-entry">'):]
              jumbo = s.find('Jumbo Technology Co., Ltd.')
          title_end = s.find('</h3>', jumbo)
          title_row_end = s.find('</div>', title_end)
          if title_end == -1 or title_row_end == -1:
              raise SystemExit('Jumbo title row not found')
          if 'milestone-star' not in s[title_end:title_row_end]:
              s = s[:title_end + 5] + '\n        ' + star + s[title_end + 5:]

          if 'career-secondary-toggle' not in s:
              exp = s.find('class="career-expand-all"')
              if exp == -1:
                  raise SystemExit('Career controls not found')
              btn_end = s.find('</button>', exp)
              if btn_end == -1:
                  raise SystemExit('Expand-all button end not found')
              btn_end += len('</button>')
              indented_button = '\n        ' + secondary_button.replace('\n', '\n        ')
              s = s[:btn_end] + indented_button + s[btn_end:]

          if '/* V58 traits + collapsed secondary career */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          if "document.querySelector('.career-secondary-toggle')" not in s:
              script_end = s.rfind('</script>')
              if script_end == -1:
                  raise SystemExit('Script end not found')
              s = s[:script_end] + '\n' + js + '\n' + s[script_end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-traits-collapse-career.yml
          git commit -m 'Add personal traits and collapse secondary career'
          git push
