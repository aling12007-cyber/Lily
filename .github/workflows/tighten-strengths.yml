name: Tighten strengths

on:
  push:
    paths:
      - .github/workflows/tighten-strengths.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit strengths
        run: |
          sed -i 's#<strong>Evidence:</strong> ##g; s#<strong>Evidence:</strong>##g; s#<strong>実績:</strong> ##g; s#<strong>実績:</strong>##g; s#<strong>実績：</strong> ##g; s#<strong>実績：</strong>##g; s#<strong>經驗證明：</strong> ##g; s#<strong>經驗證明：</strong>##g' index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
/* V55 compact strengths */
.strengths-block{margin:8px 0 12px!important}
.strengths-heading{margin-bottom:6px!important}
.strengths-grid{gap:6px!important;grid-auto-rows:auto!important}
.strength-card{min-height:0!important;height:auto!important;padding:11px 13px!important;gap:8px!important;align-content:start!important}
.strength-card>div:last-child{display:block!important}
.strength-card h3{min-height:0!important;margin:0 0 4px!important;font-size:17px!important;line-height:1.3!important}
.strength-card p{margin:0!important;font-size:13px!important;line-height:1.5!important}
@media(max-width:720px){.strength-card{padding:10px 11px!important}.strength-card h3{font-size:16px!important}.strength-card p{font-size:12.5px!important;line-height:1.45!important}}
'''
          if '/* V55 compact strengths */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/tighten-strengths.yml
          git commit -m 'Tighten strengths spacing'
          git push
