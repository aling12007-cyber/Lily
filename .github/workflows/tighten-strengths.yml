name: Tighten Professional Strengths

on:
  push:
    paths:
      - '.github/workflows/tighten-strengths.yml'

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove evidence labels and tighten spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for label in (
              '<strong>Evidence:</strong> ',
              '<strong>Evidence:</strong>',
              '<strong>実績:</strong> ',
              '<strong>実績:</strong>',
              '<strong>実績：</strong> ',
              '<strong>実績：</strong>',
              '<strong>經驗證明：</strong> ',
              '<strong>經驗證明：</strong>',
              '<strong>经验证明：</strong> ',
              '<strong>经验证明：</strong>',
          ):
              s = s.replace(label, '')

          css = '''
/* V55 compact Professional Strengths */
.strengths-block{
  margin:10px 0 14px!important;
}
.strengths-heading{
  margin-bottom:7px!important;
}
.strengths-grid{
  gap:6px!important;
  grid-auto-rows:auto!important;
}
.strength-card{
  min-height:0!important;
  height:auto!important;
  padding:12px 14px!important;
  gap:8px!important;
  align-content:start!important;
}
.strength-card > div:last-child{
  display:block!important;
}
.strength-card h3{
  min-height:0!important;
  margin:0 0 5px!important;
  font-size:17px!important;
  line-height:1.3!important;
}
.strength-card p{
  margin:0!important;
  font-size:13px!important;
  line-height:1.55!important;
}
@media(max-width:720px){
  .strength-card{
    padding:10px 12px!important;
  }
  .strength-card h3{
    font-size:16px!important;
    margin-bottom:4px!important;
  }
  .strength-card p{
    font-size:12.5px!important;
    line-height:1.5!important;
  }
}
'''
          if '/* V55 compact Professional Strengths */' not in s:
              s = s.replace('\n</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/tighten-strengths.yml
          git commit -m 'Remove strength labels and tighten card spacing'
          git push
