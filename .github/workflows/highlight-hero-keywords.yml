name: Highlight hero keywords

on:
  push:
    paths:
      - '.github/workflows/highlight-hero-keywords.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update multilingual hero highlights
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('<div class=\"hero-role\">Senior Accounting Specialist <em>in Tokyo</em> with 11+ years across accounting, audit, financial reporting and process improvement.</div>', '<div class=\"hero-role\"><em>Senior Accounting Specialist</em> <em>in Tokyo</em> with <em>11+ years</em> across accounting, audit, financial reporting and process improvement.</div>'); s=s.replace('<div class=\"hero-role\">東京を拠点に、会計・監査・財務報告・業務改善で11年以上の経験を持つ<em>シニア経理スペシャリスト。</em></div>', '<div class=\"hero-role\"><em>東京</em>を拠点に、会計・監査・財務報告・業務改善で<em>11年以上</em>の経験を持つ<em>シニア経理スペシャリスト。</em></div>'); s=s.replace('<div class=\"hero-role\">以東京為據點，具備 11 年以上會計、審計、財務報告與流程改善經驗的<em>資深會計專員。</em></div>', '<div class=\"hero-role\">以<em>東京</em>為據點，具備 <em>11 年以上</em>會計、審計、財務報告與流程改善經驗的<em>資深會計專員。</em></div>'); p.write_text(s, encoding='utf-8')"
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/highlight-hero-keywords.yml
          git commit -m "Highlight hero keywords consistently"
          git push
