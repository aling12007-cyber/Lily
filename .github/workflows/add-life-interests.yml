name: Add Life Beyond Work interests

on:
  push:
    paths:
      - .github/workflows/add-life-interests.yml

permissions:
  contents: write

jobs:
  update-interests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add interests
        env:
          ADDITIONS_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          if 'data-lang="en">Photography</span>' not in text:
              anchor = 'data-lang="en">City Walking</span>'
              start = text.find(anchor)
              if start == -1:
                  raise SystemExit("City Walking anchor not found")
              end = text.find('</article>', start)
              if end == -1:
                  raise SystemExit("City Walking article end not found")
              end += len('</article>')
              additions = base64.b64decode(os.environ["ADDITIONS_B64"]).decode("utf-8")
              path.write_text(text[:end] + additions + text[end:], encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Life Beyond Work interests"
          git push
