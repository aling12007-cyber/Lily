name: Unify interest icon style

on:
  push:
    paths:
      - .github/workflows/unify-interest-icons.yml

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace emoji icons with line-art SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '📷': '',
              '✈️': '',
              '🎾': '',
              '🐎': '',
              '🎨': ''
          }
          for emoji, encoded in replacements.items():
              marker = f'>{emoji}</div>'
              pos = text.find(marker)
              if pos == -1:
                  continue
              start = text.rfind('<div aria-hidden="true"', 0, pos)
              if start == -1:
                  raise SystemExit(f'wrapper not found for {emoji}')
              end = pos + len(marker)
              new_html = base64.b64decode(encoded).decode('utf-8')
              text = text[:start] + new_html + text[end:]
          css_encoded = ''
          if '/* unified line-art style for added interests */' not in text:
              css = base64.b64decode(css_encoded).decode('utf-8')
              text = text.replace('</style>', css + '\n</style>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/unify-interest-icons.yml
          git commit -m "Unify Life Beyond Work icon style"
          git push
