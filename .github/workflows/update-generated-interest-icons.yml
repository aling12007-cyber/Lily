name: Update refined interest icons

on:
  push:
    paths:
      - .github/workflows/update-generated-interest-icons.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace added interest icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          icons = {
            'Photography': '''<svg viewBox="0 0 72 72" role="img" aria-label="Photography"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 25h10l5-6h14l5 6h10a6 6 0 0 1 6 6v24a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V31a6 6 0 0 1 6-6Z" stroke="#a77f9d" stroke-width="2"/><rect x="18" y="20" width="10" height="5" rx="2" stroke="#a77f9d" stroke-width="1.7"/><circle cx="36" cy="43" r="13" stroke="#a77f9d" stroke-width="2"/><circle cx="36" cy="43" r="8" stroke="#a8a2d7" stroke-width="2"/><path d="M31 40c2-3 4-4 7-4" stroke="#d7a8bf" stroke-width="1.8"/><circle cx="41" cy="39" r="1.5" stroke="#a8a2d7" stroke-width="1.4"/><path d="M13 15l4 4m0-4-4 4" stroke="#a8a2d7" stroke-width="1.6"/><path d="M57 13l1.8 3.6L62 18l-3.2 1.4L57 23l-1.8-3.6L52 18l3.2-1.4Z" stroke="#b99361" stroke-width="1.5"/></g></svg>''',
            'Travel': '''<svg viewBox="0 0 72 72" role="img" aria-label="Travel"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M13 40c10-2 19-5 28-9l12-17c1.6-2.2 4.8-2.6 7-1.2l-6 20 10 6c2.2 1.4 2 4.7-.4 5.7l-12-1.8-10 13c-1.4 2-4.7 1.5-5.3-.9l2-14c-9 2.5-17 3.6-25 3.8Z" stroke="#a77f9d" stroke-width="2"/><path d="M12 51c7 5 16 7 26 7" stroke="#a8a2d7" stroke-width="1.7" stroke-dasharray="3 4"/><path d="M15 16l3 3m0-3-3 3" stroke="#a8a2d7" stroke-width="1.6"/><path d="M56 52l1.6 3.3L61 57l-3.4 1.7L56 62l-1.6-3.3L51 57l3.4-1.7Z" stroke="#b99361" stroke-width="1.5"/></g></svg>''',
            'Tennis': '''<svg viewBox="0 0 72 72" role="img" aria-label="Tennis"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="29" cy="28" rx="14" ry="18" transform="rotate(35 29 28)" stroke="#a77f9d" stroke-width="2"/><path d="M38 42l14 18M49 55l-5 4" stroke="#b99361" stroke-width="2.2"/><path d="M20 18l20 16M17 25l20 15M25 12l-8 30M32 11l-9 34" stroke="#a8a2d7" stroke-width="1" opacity=".9"/><circle cx="52" cy="20" r="7" stroke="#a77f9d" stroke-width="1.8"/><path d="M47 17c3 1 4 3 5 6M57 17c-3 1-4 3-5 6" stroke="#d7a8bf" stroke-width="1.4"/><path d="M56 9l1.3 2.7L60 13l-2.7 1.3L56 17l-1.3-2.7L52 13l2.7-1.3Z" stroke="#b99361" stroke-width="1.4"/></g></svg>''',
            'Horse Riding': '''<svg viewBox="0 0 72 72" role="img" aria-label="Horse Riding"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 55c4-10 4-19 1-27 5-7 11-12 19-15l5 6 7 2-4 7 5 8-6 6-8-2-5 8c-3 5-7 8-14 7Z" stroke="#a77f9d" stroke-width="2"/><path d="M24 27c7 2 13 1 19-3M23 35c8 2 14 1 20-2" stroke="#a8a2d7" stroke-width="1.6"/><path d="M42 20l-1-7 6 5M48 23l5-5" stroke="#b99361" stroke-width="1.6"/><path d="M41 24l7 6-5 9M47 30l6 2" stroke="#a77f9d" stroke-width="1.6"/><circle cx="48" cy="30" r="2" stroke="#b99361" stroke-width="1.5"/><circle cx="43" cy="39" r="2" stroke="#b99361" stroke-width="1.5"/><path d="M18 39v12M18 51c-3 0-5 2-5 5v5h10v-5c0-3-2-5-5-5Z" stroke="#b99361" stroke-width="1.7"/><path d="M12 16h6m-3-3v6" stroke="#d7a8bf" stroke-width="1.5"/></g></svg>''',
            'Painting': '''<svg viewBox="0 0 72 72" role="img" aria-label="Painting"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M34 12c-14 0-25 10-25 23 0 14 12 25 27 25 5 0 8-3 7-7-1-4 2-7 6-7h5c6 0 10-4 10-10 0-13-13-24-30-24Z" stroke="#a77f9d" stroke-width="2"/><circle cx="23" cy="28" r="3" stroke="#d7a8bf" stroke-width="1.7"/><circle cx="32" cy="22" r="3" stroke="#a8a2d7" stroke-width="1.7"/><circle cx="20" cy="39" r="3" stroke="#b99361" stroke-width="1.7"/><circle cx="31" cy="45" r="3" stroke="#d7a8bf" stroke-width="1.7"/><path d="M54 12c2 0 4 2 4 4L43 52c-.7 1.8-3 2.6-4.6 1.6-1.5-.9-2-2.8-1.2-4.4L52 15c.4-1.8.9-3 2-3Z" stroke="#a77f9d" stroke-width="1.8"/><path d="M50 20l6 3" stroke="#b99361" stroke-width="1.8"/><path d="M57 8l1.5 3L62 12.5 58.5 14 57 17l-1.5-3L52 12.5 55.5 11Z" stroke="#b99361" stroke-width="1.4"/></g></svg>'''
          }

          for title, svg in icons.items():
              pattern = re.compile(
                  r'(<article class="interest-generated">\s*<div class="interest-line-icon" aria-hidden="true">).*?(</div>\s*<div class="interest-copy"><h4><span data-lang="en">' + re.escape(title) + r'</span>)',
                  re.S
              )
              text, count = pattern.subn(lambda m: m.group(1) + '\n      ' + svg + '\n    ' + m.group(2), text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update {title}: {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-generated-interest-icons.yml
          git commit -m "Refine Life Beyond Work interest icons"
          git push
