name: Update systems automation label
on:
  push:
    paths:
      - '.github/workflows/update-systems-automation-label.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="float-note fn2"><b><span data-lang="en">IT Specialist</span><span data-lang="ja">ITスペシャリスト</span><span data-lang="zh">IT專才</span></b></div>'
          new = '<div class="float-note fn2"><b><span data-lang="en">Systems &amp; Automation</span><span data-lang="ja">システム活用・業務自動化</span><span data-lang="zh">系統應用・流程自動化</span></b></div>'
          if old not in s:
              raise SystemExit('Target label not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/update-systems-automation-label.yml
          git commit -m 'Change IT label to Systems & Automation'
          git push
