name: Refine resume site
on:
  push:
    paths:
      - '.github/workflows/refine-resume-site.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Refine resume site
        run: python .github/scripts/refine-resume-site.py
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/refine-resume-site.py .github/workflows/refine-resume-site.yml
          git commit -m "Refine resume content and presentation"
          git push
