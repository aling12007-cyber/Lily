name: Add mobile title menu

on:
  push:
    paths:
      - .github/workflows/add-mobile-title-menu.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add mobile navigation menu
        run: |
          echo '' | base64 -d > /tmp/update_mobile_menu.py
          python /tmp/update_mobile_menu.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-mobile-title-menu.yml
          git commit -m "Add mobile title navigation menu"
          git push
