name: Update seven life stories
on:
  push:
    paths:
      - '.github/workflows/update-seven-life-stories.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Replace expandable life story
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_story = '''<div class="about-story-content">
          <div class="life-story-grid-v60">
            <article class="life-story-item-v60">
              <div class="life-story-no-v60">01</div>
              <div>
                <h3><span data-lang="en">Where I Began</span><span data-lang="ja">私の原点</span><span data-lang="zh">我的起點</span></h3>
                <p><span data-lang="en">I was born and raised in Dajia, Taichung. Losing my father at five made me aware early that some parts of life cannot be chosen. Family and my upbringing gradually taught me independence, and that taking care of my own responsibilities is also a way of caring for the people around me.</span><span data-lang="ja">私は台中・大甲で生まれ育ちました。5歳で父を亡くしたことで、人生には自分では選べないことがあると早くから知りました。家族や育った環境の中で少しずつ自立を学び、自分のことをきちんとやり遂げることは、自分だけでなく周りの人への責任でもあると考えるようになりました。</span><span data-lang="zh">我出生、成長於台中大甲。五歲時父親早逝，讓我比同齡的孩子更早感受到，生活裡有些事情無法選擇。家庭與成長環境讓我慢慢學會獨立，也讓我很早就明白，能夠把自己的事情做好，是一種對自己、也對身邊人的責任。</span></p>
              </div>
            </article>

            <article class="life-story-item-v60">
              <div class="life-story-no-v60">02</div>
              <div>
                <h3><span data-lang="en">Growing Into My Personality</span><span data-lang="ja">今の性格ができるまで</span><span data-lang="zh">我怎麼慢慢長成現在的性格</span></h3>
                <p><span data-lang="en">I am not someone who becomes close to people immediately. I tend to observe and understand first, then build trust slowly. Being slow to warm up also made me more attentive to details. I value responsibility and principles, while experience has taught me to see situations from other people's perspectives as well.</span><span data-lang="ja">私は誰とでもすぐに打ち解けるタイプではなく、まず相手や状況を観察し、理解してから少しずつ信頼関係を築くほうです。その慎重さは、物事をよく見る習慣にもつながりました。責任感と自分なりの原則を大切にしながら、経験を重ねる中で相手の立場から考えることも学んできました。</span><span data-lang="zh">我不是很快就能和所有人熟起來的人，通常會先觀察、理解，再慢慢建立信任。這樣的慢熟，也讓我養成仔細觀察的習慣。對工作和生活，我重視責任感，也有自己不太願意妥協的原則；但隨著經歷增加，我也學會站在不同人的角度理解事情。</span></p>
              </div>
            </article>

            <article class="life-story-item-v60">
              <div class="life-story-no-v60">03</div>
              <div>
                <h3><span data-lang="en">Entering the Working World</span><span data-lang="ja">初めて社会に出たとき</span><span data-lang="zh">第一次進入職場</span></h3>
                <p><span data-lang="en">After choosing accounting, I quickly learned that knowing something in school and doing it in practice are very different. From my first job, I learned to be accountable for numbers, deadlines and my own judgment. Later, working at PwC exposed me to different companies, systems and professional standards, and became an important part of growing from a student into a professional.</span><span data-lang="ja">会計を選んでから、学校で知識として学ぶことと、実務で使うことはまったく違うと実感しました。最初の仕事では数字や期限、自分の判断に責任を持つことを学び、その後PwCではさまざまな企業、仕組み、仕事の基準に触れました。学生から社会人へと変わっていく上で、大切な時期だったと思います。</span><span data-lang="zh">選擇會計之後，我才真正理解，學校裡知道的知識和實際工作是兩件不同的事。從第一份工作開始，我學著對數字、期限和自己的判斷負責；之後進入 PwC，更讓我接觸到不同企業、制度與工作標準。那段時間，是我從學生慢慢變成職場人的重要過程。</span></p>
              </div>
            </article>

            <article class="life-story-item-v60">
              <div class="life-story-no-v60">04</div>
              <div>
                <h3><span data-lang="en">Life Did Not Follow a Plan</span><span data-lang="ja">人生は計画通りではなかった</span><span data-lang="zh">人生沒有照計畫走</span></h3>
                <p><span data-lang="en">Looking back, my career did not follow one complete blueprint. I changed jobs, entered different industries and had moments when I questioned myself. I did not always know whether a decision was right at the time, but each new start helped me understand what matters to me, what does not fit me, and where I want to go next.</span><span data-lang="ja">振り返ると、私のキャリアは一枚の設計図どおりに進んできたわけではありません。転職し、異なる業界を経験し、自分の選択に迷ったこともあります。その時点では正解か分からなくても、環境に適応し直すたびに、自分が大切にしたいこと、合わないこと、次に向かいたい方向が少しずつ見えるようになりました。</span><span data-lang="zh">回頭看，我的職涯並不是按照一張完整的藍圖一路前進。換過工作、進入過不同產業，也有過懷疑自己的時候。有些選擇當下並不知道是不是正確，但每一次重新適應，都讓我更清楚自己重視什麼、不適合什麼，以及下一步想往哪裡走。</span></p>
              </div>
            </article>

            <article class="life-story-item-v60">
              <div class="life-story-no-v60">05</div>
              <div>
                <h3><span data-lang="en">Leaving Familiar Places</span><span data-lang="ja">慣れた場所を離れる</span><span data-lang="zh">離開熟悉的地方</span></h3>
                <p><span data-lang="en">Later, my work and life expanded from Taiwan to China, Hong Kong and Japan. Leaving familiar surroundings taught me that change is not simply moving to another country—it means repeatedly learning new cultures, people and ways of working. Those experiences widened my perspective and gave me confidence that I can rebuild my footing in unfamiliar environments.</span><span data-lang="ja">その後、仕事と生活の舞台は台湾から中国、香港、日本へと広がりました。慣れた場所を離れて分かったのは、変化とは単に国を移ることではなく、文化、人、仕事の進め方を何度も学び直すことだということです。そうした経験は私の視野を広げ、知らない環境でも自分の生活を組み立て直せるという自信につながりました。</span><span data-lang="zh">後來，我的工作與生活從台灣延伸到中國、香港，再到日本。真正離開熟悉的環境後，我才發現改變不只是換一個國家，而是一次次重新理解文化、人與工作的方式。這些經驗讓我的世界變大，也讓我更相信自己有能力在陌生環境裡重新建立生活。</span></p>
              </div>
            </article>

            <article class="life-story-item-v60">
              <div class="life-story-no-v60">06</div>
              <div>
                <h3><span data-lang="en">Who I Am Outside Work</span><span data-lang="ja">仕事以外の私</span><span data-lang="zh">工作以外的我</span></h3>
                <p><span data-lang="en">Outside work, I like to keep some freshness in everyday life. Travel, exercise, walks, reading, and exploring new technology or AI tools are all ways for me to stay curious. I enjoy learning something I could not do before, while also valuing ordinary days that have no special purpose beyond living them well.</span><span data-lang="ja">仕事以外では、日常に少し新鮮さを残しておくことが好きです。旅行、運動、散歩、読書、新しいテクノロジーやAIツールを試すことも、私にとって世界を知る方法です。できなかったことができるようになる過程を楽しむ一方で、特別な目的のない普通の日々も大切にしています。</span><span data-lang="zh">工作以外，我喜歡讓生活保持一些新鮮感。旅行、運動、散步、閱讀，或研究新的科技與 AI 工具，對我來說都是認識世界的方式。我享受學會一件原本不會的事情，也珍惜那些沒有特別目的、只是好好生活的普通日子。</span></p>
              </div>
            </article>

            <article class="life-story-item-v60 life-story-final-v60">
              <div class="life-story-no-v60">07</div>
              <div>
                <h3><span data-lang="en">Who I Am Today</span><span data-lang="ja">今の私</span><span data-lang="zh">現在的我</span></h3>
                <p><span data-lang="en">I do not feel that I have reached a finished version of my life. There are still things I want to learn, places I want to see and questions about who I want to become next. But when I pause and look at the life I have now, I sometimes realize something that once felt very far away has quietly become real.</span><span data-lang="ja">今の自分が人生の完成形だとは思っていません。まだ学びたいこと、行ってみたい場所、次の自分について考えたいことがたくさんあります。ただ、ときどき立ち止まって今の生活を見ると、かつて遠いと思っていたものが、いつの間にか現実になっていることに気づきます。</span><span data-lang="zh">現在回頭看，我不會覺得自己已經到了某個「完成」的地方。還是有很多想學的事、想去的地方，也仍然在思考下一個階段想成為什麼樣的人。只是偶爾停下來看現在的生活，我會突然發現：</span></p>
                <blockquote class="about-story-quote"><span data-lang="en">“I am living the overseas life that my younger self once admired.”</span><span data-lang="ja">「今の私は、子どもの頃の自分が憧れていた海外生活を送っています。」</span><span data-lang="zh">「我正在過著小時候的我所羨慕的海外生活。」</span></blockquote>
                <p><span data-lang="en">It does not mean life is perfect. It simply reminds me that a place that once felt far away was reached one step at a time.</span><span data-lang="ja">それは人生が完璧だという意味ではありません。かつて遠く感じていた場所まで、本当に一歩ずつ歩いてきたのだと気づかせてくれる言葉です。</span><span data-lang="zh">這不是說人生已經完美，而是提醒自己：原來曾經覺得很遙遠的地方，我真的一步一步走到了。</span></p>
              </div>
            </article>
          </div>
        </div>'''

          pattern = r'<div class="about-story-content">.*?</div>\s*</details>'
          s2, n = re.subn(pattern, new_story + '\n      </details>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one About story block, replaced {n}')

          css = '''
/* V60 seven-part life story */
.life-story-grid-v60{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:2px}
.life-story-item-v60{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:15px 16px;border:1px solid rgba(78,61,82,.09);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(247,241,248,.62))}
.life-story-no-v60{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1;color:#b38a50;padding-top:3px}
.life-story-item-v60 h3{margin:0 0 7px;font-size:15px;line-height:1.4;color:var(--ink)}
.life-story-item-v60 p{margin:0!important;font-size:13px!important;line-height:1.72!important;color:#675c69!important}
.life-story-final-v60{grid-column:1 / -1}
.life-story-final-v60 .about-story-quote{margin:12px 0!important;font-size:17px!important}
@media(max-width:820px){.life-story-grid-v60{grid-template-columns:1fr}.life-story-final-v60{grid-column:auto}}
@media(max-width:720px){.life-story-grid-v60{gap:8px}.life-story-item-v60{grid-template-columns:32px minmax(0,1fr);gap:8px;padding:13px}.life-story-no-v60{font-size:16px}.life-story-item-v60 h3{font-size:14px;margin-bottom:6px}.life-story-item-v60 p{font-size:12.5px!important;line-height:1.68!important}.life-story-final-v60 .about-story-quote{font-size:15px!important}}
'''
          if '/* V60 seven-part life story */' not in s2:
              s2 = s2.replace('</style>', css + '\n</style>', 1)

          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-seven-life-stories.yml
          git commit -m "Add seven-part personal life story"
          git push
