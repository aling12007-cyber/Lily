name: Add expandable About story

on:
  push:
    paths:
      - '.github/workflows/add-about-story.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add expandable story
        run: |
          echo '' | base64 -d > /tmp/story.html
          echo '' | base64 -d > /tmp/story.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          story = Path('/tmp/story.html').read_text(encoding='utf-8')
          css = Path('/tmp/story.css').read_text(encoding='utf-8')
          if 'about-story-details' in s:
              raise SystemExit('Expandable About story already exists')
          pattern = re.compile(r'(<div class="about-bridge">.*?</div>)', re.S)
          s, n = pattern.subn(lambda m: m.group(1) + '\n' + story, s, count=1)
          if n != 1:
              raise SystemExit('About section could not be located')
          if '/* V57 expandable About story */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-about-story.yml
          git commit -m 'Add expandable About story'
          git push
