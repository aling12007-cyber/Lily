name: Add expandable About story

on:
  push:
    paths:
      - '.github/workflows/add-about-story.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add expandable story
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'about-story-details' in s:
              raise SystemExit('Expandable About story already exists')

          story = '''
      <details class="about-story-details">
        <summary>
          <span class="story-label-closed">
            <span data-lang="en">Read more of my story</span>
            <span data-lang="ja">もう少しストーリーを読む</span>
            <span data-lang="zh">閱讀更多故事</span>
          </span>
          <span class="story-label-open">
            <span data-lang="en">Close story</span>
            <span data-lang="ja">ストーリーを閉じる</span>
            <span data-lang="zh">收起故事</span>
          </span>
          <span class="story-toggle-icon" aria-hidden="true">+</span>
        </summary>
        <div class="about-story-content">
          <p>
            <span data-lang="en">As a child, I had a simple fascination with life abroad. I rarely had opportunities to travel, so the world beyond Taiwan felt distant and full of possibility. As I grew older, I began to understand that if I wanted to see a bigger world, I would have to take the first step myself.</span>
            <span data-lang="ja">子どもの頃の私は、海外で暮らすことに素朴な憧れを持っていました。海外へ行く機会はほとんどなく、台湾の外の世界は遠く、可能性に満ちた場所のように感じていました。大人になるにつれて、もっと広い世界を見たいなら、まず自分自身で一歩を踏み出す必要があると考えるようになりました。</span>
            <span data-lang="zh">小時候的我，對「海外生活」有一種很單純的嚮往。那時很少有機會出國，台灣以外的世界對我來說既遙遠，又充滿可能。長大後我慢慢明白，如果真的想看看更大的世界，很多時候只能先靠自己踏出第一步。</span>
          </p>
          <p>
            <span data-lang="en">Once I actually left Taiwan, I learned that living abroad was not only about novelty and freedom. Moving through China, Hong Kong and Japan meant repeatedly learning new cultures, working styles and everyday routines. There were moments of uncertainty and difficulty, but those experiences taught me that starting again is not something to fear—and showed me how much I could adapt and keep moving forward.</span>
            <span data-lang="ja">実際に台湾を離れてみると、海外生活は新鮮さや自由だけではないことも知りました。中国、香港、日本へと移るたびに、文化、仕事の進め方、日常生活を一から理解し直す必要がありました。不安や大変さもありましたが、その経験を通して、もう一度始めることを恐れなくなり、自分がどれだけ適応し前へ進めるのかを知ることができました。</span>
            <span data-lang="zh">真正離開台灣之後，我才發現海外生活並不只有新鮮與自由。從中國、香港到日本，每一次移動，都代表重新理解文化、工作方式與日常生活。過程中當然也有不確定與辛苦，但正是這些經驗，讓我不再害怕重新開始，也更知道自己可以適應多少、走多遠。</span>
          </p>
          <blockquote class="about-story-quote">
            <span data-lang="en">“I am living the overseas life that my younger self once admired.”</span>
            <span data-lang="ja">「今の私は、子どもの頃の自分が憧れていた海外生活を送っています。」</span>
            <span data-lang="zh">「我正在過著小時候的我所羨慕的海外生活。」</span>
          </blockquote>
          <p>
            <span data-lang="en">To me, that sentence does not mean life is perfect. It reminds me that the girl who once thought the wider world was very far away eventually reached a place she had once imagined, one decision at a time. That journey continues to shape how I learn, work and explore what comes next.</span>
            <span data-lang="ja">この言葉は、今の生活が完璧だという意味ではありません。かつて広い世界を遠く感じていた自分が、一つひとつの選択を重ねながら、いつか思い描いていた場所まで本当に歩いてきたことを思い出させてくれる言葉です。この経験は、今も私の学び方、働き方、そして次の挑戦への向き合い方につながっています。</span>
            <span data-lang="zh">這句話並不是說現在的生活完美，而是提醒我：那個曾經覺得外面的世界很遙遠的小女孩，真的靠著一次次選擇，一步一步走到了自己曾經嚮往的地方。這段路，也持續影響著我現在學習、工作，以及面對下一個挑戰的方式。</span>
          </p>
        </div>
      </details>'''

          pattern = re.compile(r'(<div class="about-bridge">.*?</div>)', re.S)
          s, n = pattern.subn(lambda m: m.group(1) + '\n' + story, s, count=1)
          if n != 1:
              raise SystemExit('About section could not be located')

          css = '''
/* V57 expandable About story */
.about-story-details{
  margin-top:10px;
  border-top:1px solid rgba(78,61,82,.10);
}
.about-story-details summary{
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
  padding:12px 2px 4px;
  cursor:pointer;
  color:var(--mauve);
  font-size:12px;
  font-weight:800;
  letter-spacing:.03em;
}
.about-story-details summary::-webkit-details-marker{display:none}
.story-label-open{display:none}
.about-story-details[open] .story-label-closed{display:none}
.about-story-details[open] .story-label-open{display:inline}
.story-toggle-icon{
  flex:0 0 auto;
  font-size:20px;
  line-height:1;
  font-weight:400;
  transition:transform .2s ease;
}
.about-story-details[open] .story-toggle-icon{transform:rotate(45deg)}
.about-story-content{
  max-width:1040px;
  padding:12px 0 4px;
}
.about-story-content p{
  margin:0 0 14px;
  color:#625765;
  font-size:14px;
  line-height:1.85;
}
.about-story-quote{
  margin:18px 0;
  padding:15px 18px;
  border-left:3px solid rgba(185,147,97,.62);
  background:rgba(248,243,248,.72);
  color:#514652;
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  line-height:1.65;
}
@media(max-width:720px){
  .about-story-details summary{padding-top:10px;font-size:11.5px}
  .about-story-content{padding-top:10px}
  .about-story-content p{font-size:13px;line-height:1.75}
  .about-story-quote{font-size:16px;padding:13px 14px;margin:15px 0}
}
'''
          if '/* V57 expandable About story */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-about-story.yml
          git commit -m 'Add expandable About story'
          git push
