name: Update LinkedIn profile link

on:
  push:
    paths:
      - '.github/workflows/update-link.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace LinkedIn URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://www.linkedin.com/in/yu-ling'
          new = 'https://www.linkedin.com/in/yu-ling-l-0a185a166'
          if old not in text:
              raise SystemExit('Old LinkedIn URL not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit updated link and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/update-link.yml
          git commit -m 'Update LinkedIn profile link'
          git push
