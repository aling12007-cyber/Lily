name: Update career toolbar labels
on:
  push:
    paths:
      - '.github/workflows/update-career-toolbar-labels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Update toolbar labels and alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '<span data-lang="en">Expand all</span><span data-lang="ja">すべて展開</span><span data-lang="zh">全部展開</span>': '<span data-lang="en">Expand job details</span><span data-lang="ja">職務詳細を展開</span><span data-lang="zh">展開職務細節</span>',
              '<span data-lang="en">Collapse all</span><span data-lang="ja">すべて閉じる</span><span data-lang="zh">全部收起</span>': '<span data-lang="en">Collapse job details</span><span data-lang="ja">職務詳細を閉じる</span><span data-lang="zh">收起職務細節</span>',
              '<span data-lang="en">Show other roles</span><span data-lang="ja">その他の職歴を表示</span><span data-lang="zh">展開其他職涯</span>': '<span data-lang="en">Show all experience</span><span data-lang="ja">すべての職歴を表示</span><span data-lang="zh">展開所有經歷</span>',
              '<span data-lang="en">Hide other roles</span><span data-lang="ja">その他の職歴を隠す</span><span data-lang="zh">收起其他職涯</span>': '<span data-lang="en">Show key milestones only</span><span data-lang="ja">重要な職歴のみ表示</span><span data-lang="zh">僅顯示重要職涯</span>',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected label: {old}')
              s = s.replace(old, new, 1)

          css = '''
/* V64 career toolbar wording + legend alignment */
.career-toolbar .career-legend{
  justify-content:flex-start!important;
  text-align:left!important;
  width:100%!important;
}
@media(max-width:720px){
  .career-toolbar .career-legend{
    justify-content:flex-start!important;
    text-align:left!important;
  }
}
'''
          if '/* V64 career toolbar wording + legend alignment */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-career-toolbar-labels.yml
          git commit -m "Refine career toolbar labels and alignment"
          git push
