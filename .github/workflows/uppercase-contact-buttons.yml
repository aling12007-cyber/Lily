name: Uppercase contact buttons

on:
  push:
    paths:
      - .github/workflows/uppercase-contact-buttons.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uppercase LinkedIn label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '>LinkedIn</a>'
          if old not in text:
              raise SystemExit('LinkedIn label not found')
          text = text.replace(old, '>LINKEDIN</a>')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/uppercase-contact-buttons.yml
          git commit -m "Uppercase contact button labels"
          git push
