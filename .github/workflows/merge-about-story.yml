name: Merge About and Story sections

on:
  push:
    paths:
      - '.github/workflows/merge-about-story.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply merged About section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          combined = base64.b64decode('').decode('utf-8')
          css = base64.b64decode('').decode('utf-8')
          s = s.replace('      <a href="#story"><span data-lang="en">Story</span><span data-lang="ja">歩み</span><span data-lang="zh">故事</span></a>\n', '', 1)
          pattern = re.compile(r'<section class="section" id="profile">.*?(?=<section class="section" id="experience">)', re.S)
          s, n = pattern.subn(combined, s, count=1)
          if n != 1:
              raise SystemExit('Could not merge About and Story sections')
          for section_id, old, new in [('experience','03','02'),('education','04','03'),('expertise','05','04'),('life','06','05'),('contact','07','06')]:
              pat = re.compile(r'(<section class="section" id="' + section_id + r'">\s*<div class="section-grid">\s*<div class="section-no">)' + old + r'(</div>)')
              s, count = pat.subn(lambda m: m.group(1) + new + m.group(2), s, count=1)
              if count != 1:
                  raise SystemExit('Could not renumber ' + section_id)
          s = s.replace('\n</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/merge-about-story.yml
          git commit -m 'Merge About and Story into one concise section'
          git push
